# Override for local development to avoid port conflicts with production

services:
  app:
    ports: !override
      - '3001:3000'   # Web (dev on 3001)
      - '3037:3036'   # Vite dev server
      - '4001:4000'   # Streaming (dev on 4001)
    environment:
      LOCAL_DOMAIN: 'mastodon.local:3001'
      VITE_DEV_SERVER_PUBLIC: 'localhost:3037'
      # Disable Elasticsearch for simpler setup
      ES_ENABLED: 'false'
